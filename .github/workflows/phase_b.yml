name: Wasm try-catch Phase B
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  phase-b:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provenance
        run: |
          uname -m && sw_vers
          JSC=/System/Library/Frameworks/JavaScriptCore.framework/Helpers/jsc
          file "$JSC"
          codesign -dv "$JSC" 2>&1 | grep -E "Identifier|Authority" | head -3
          echo "JSC=$JSC" >> $GITHUB_ENV
      - name: CONTROL
        run: |
          "$JSC" control.js 2>&1
          echo "control_exit=$?" >> $GITHUB_ENV
      - name: EXPLOIT
        run: |
          set +e
          "$JSC" poc.js 2>&1
          EXIT=$?
          set -e
          echo "exploit_exit=$EXIT" >> $GITHUB_ENV
          [ $EXIT -eq 139 ] && echo "RESULT=SIGSEGV" >> $GITHUB_ENV || true
          [ $EXIT -eq 134 ] && echo "RESULT=SIGABRT" >> $GITHUB_ENV || true
          [ $EXIT -eq 0 ]   && echo "RESULT=EXIT0" >> $GITHUB_ENV || true
          [ -z "$RESULT" ]  && echo "RESULT=EXIT_$EXIT" >> $GITHUB_ENV || true
      - name: Summary
        if: always()
        run: |
          echo "OS=$(sw_vers -productVersion) arch=$(uname -m)"
          echo "control=$control_exit exploit=$exploit_exit result=$RESULT"
